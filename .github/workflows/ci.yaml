name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    smoke:
        name: Typecheck, build & smoke test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build
              env:
                  # Build-time placeholders only; nothing here reaches GitHub or Authentik
                  AUTH_SECRET: ci-build-placeholder
                  NEXT_TELEMETRY_DISABLED: "1"

            - name: Smoke test
              run: npm run test:smoke
              env:
                  NEXT_TELEMETRY_DISABLED: "1"
